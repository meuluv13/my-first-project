<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container"> 

        <div class="left">
        <img src="./bg.jpg" alt="image" width="700" height="700">
        </div>

        <div class="right">
            <h2>Get iintoo it today </h2>
            <p> There is no charge or obligation upon registration </p>

            <button class="facebook"> 
                <img src="./facebook.svg" alt="image" width="20" height="20">
                Register with Facebook
            </button> 
            <button class="linkedin">
                <img src="./linkedin.svg" alt="image" width="20" height="20">
                Register with LinkedIn
             </button>

             <div class="separator">
                <span></span>
                OR
                <span></span>
            </div>

        
        <div class="inputs">

        <input type="email" placeholder="enter your email address">

        <input type="Phone" placeholder=" phone">
     </div>

     <h3>What type of investor are you?</h3>

     <p class="description">
                Select the type of investor you are below.
            </p>
             <div class="investor-types">
                <label><input type="radio" name="investor" checked> Individual</label>
                <label><input type="radio" name="investor"> Business</label>
                <label><input type="radio" name="investor"> IRA</label>
                <label><input type="radio" name="investor"> Trust</label>
            </div>
             <div class="terms">
                <input type="checkbox">
                <span>
                    I agree to the terms and receiving notifications
                    from iintoo <a href="#">View full terms</a>
                </span>
            </div>

            <button class="create-account">Create Account</button>

        </div>
    </div>

     


   
</body>
</html>
