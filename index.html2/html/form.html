    <p>
    <label for="search">search google</label> 
    <input type="text" id="search" name="q" placeholder="input text" required>

        <button type="submit">search</button>

    </p>
</form>
<form>
    <p>
    <label for="name">Name:</label>
        <input type="text" id="Name" placeholder="Enter your name" required>
       
    </p>

</form>
<form>
    <p>
    <label for="Email">Email:</label>
        <input type="email" id="Email" placeholder="Enter your email" required>
    </p>
<p> 
<label for="Password">Password:</label>
        <input type="password" id="Password" placeholder="Enter your password" required>
</p>
<p> 
    <button type="submit">submit</button>
</p>
</form>
<form> 
    <div>Pick a color</div>

    <p>
        <input type="radio" id="blue" name="options" value="blue" checked>
        <label for="blue">blue</label>
        </p>
        <p>
        <input type="radio" id="red" name="options" value="red">
        <label for="red">red</label>
        </p>
</form>
